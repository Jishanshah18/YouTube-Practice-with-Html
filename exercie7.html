<!DOCTYPE html>
<html>
    <head>
        <title>EXP 7</title>
        <style>

            .rectangle {
                width: 200px;
                border-width: 20px;
                border-color: black;
                border-radius: 10px;
                margin-right: 20px;

            }
            .square {
                width:200px;

            }
            .circle{
                width: 200px;
                margin-left: 20px;
                border-radius: 100px;

            }

            .search {
                font-size: 20px;
                font-family:solid;
                width: 190px;
                height:35px;
                border-radius: 5px;
                border-style: solid;
                margin-top: 10px;
                padding-left: 8px;
            }
            .search-bar{
                width: 375px;
                border: none;
                height: 30px;
                font-size: 15px;
                border-radius: 20px;
                margin-top: 0px;
                padding-left: 15px;
                padding-top: 5px;
                padding-bottom: 5px;
                box-shadow:5px 5px 5px rgba(2, 72, 106, 0.51);
                



            }
            .search-bar :hover{
                opacity: 0.8px;
            }
            .mail{
                margin-bottom: 0px;
                color:rgb(3, 3, 84);
            }
            .box{
                height: 20px;
                width: 370px;
                margin-top: 0px;
            }
            .button{
             background-color: hwb(201 0% 0%);
            color: white;
            border: none;
            height: 45px;
            width: 375px;
            border-radius: 25px;
            cursor: pointer;
            font-size: 15px;
            margin-right: 8px;
            margin-top: 0px;
            transition: opacity 0.11s;
            padding-top: 1px;
            padding-left: 1px;
            padding-right: 1px;
            padding-bottom: 1px;
         }

        .button:hover {
            background-color: hwb(201 0% 0%);
            ;
            /* opacity: o.8px; */
             color: white;
            } 

        .button:active {
            opacity: 0.35;
        } 
            
        .dp{
            border-radius: 50%;
            width: 60px;
        }
        .h8{
            margin-top: 0px;
            margin-left: 4px;
            display: inline-block;
        }
            
        </style>


    </head>
    <body>
        <img class="rectangle" src="thumbnails/thumbnail.png">
        <img class="square" src="thumbnails/thumbnail.png">
        <img class="circle" src="thumbnails/thumbnail.png">
        <p>
        <input class="search" type="text" placeholder="Search"></p>
        <p>
        <input class="search-bar" type="text" placeholder="Search Google or type a URL">
        </p>
        <p class="mail">
            Email
        </p>
        <input class="box" type="text">
        <p>By clicking Agree & Join, you agree to the Privacy Policy. </p>
        <button class="button"> Agree & Join</button>

       <p>
        <img class="dp" src="thumbnails/thumbnail.png">
       <h8 class="h8"> What's happening</h8>
       </p>
  
    </body>

</html>
