<!DOCTYPE html>
<html>
    <head>
        <title>Position Practice</title>
    </head>
    <body style="height: 4000px;">
        <div style="
            background-color: black;
            color: white;
            position: fixed;
            top: 0px;
            right: 0px;
            left: 0px;
            height: 50px;
            ">header</div>
        <div style="
            background-color: yellow;
            position:fixed;
            left: 0;
            top: 50px;
            bottom: 0;
            ">sidebar</div>

            

        <div style="
            background-color: lightgreen;
            height: 120px;
            width: 160px;
            border-radius: 80px;
            margin-top: 0px;
            margin-left: 280px;
            position: absolute;
            "></div>
         <div style="
            background-color: lightblue;
            height: 120px;
            width: 200px;
            margin-top: 70px;
            margin-left: 60px;
            position: relative;

            ">Halku
            <div style="
            position:absolute;
            display: inline-block;
            background-color: black;
            color: white;
            text-align: center;
            padding-left: 2px;
            padding-right: 2px;
            bottom: 10px;
            right: 10px;
            ">6:00
            </div>
        </div>

    </body>
</html>
